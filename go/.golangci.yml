# Enforces project test conventions and module boundaries — see AGENTS.md
# ("Test synchronization") and docs/specs/architecture.md ("What NOT to Do").
run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - forbidigo
    - depguard

linters-settings:
  forbidigo:
    # A custom forbid list REPLACES forbidigo's defaults (fmt.Print, etc.), so
    # only time.Sleep is forbidden here.
    forbid:
      - p: 'time\.Sleep'
        msg: 'no fixed time.Sleep in tests — synchronize via testutil.WaitFor* (see AGENTS.md "Test synchronization")'
  depguard:
    rules:
      exec-boundary:
        # docs/specs/architecture.md ("What NOT to Do") confines subprocess
        # calls to git/gh (internal/git), claude (internal/agent,
        # internal/claude), and bd (internal/tasks) to their owning module.
        # internal/tmux, internal/notify, internal/testutil, internal/server,
        # internal/verify, and cmd/ralph/helpers.go already have vetted
        # os/exec use for unrelated tools (tmux, terminal-notifier, kill,
        # pgrep/pkill, bash, test/build runners) — they are not part of the
        # git/gh/bd/claude boundary this rule guards.
        files:
          - "$all"
          - "!$test"
          - "!**/internal/git/**"
          - "!**/internal/agent/**"
          - "!**/internal/claude/**"
          - "!**/internal/tasks/**"
          - "!**/internal/tmux/**"
          - "!**/internal/notify/**"
          - "!**/internal/testutil/**"
          - "!**/internal/server/**"
          - "!**/internal/verify/**"
          - "!**/cmd/ralph/helpers.go"
        deny:
          - pkg: "os/exec"
            desc: "os/exec is confined to internal/git, internal/agent, internal/claude, internal/tasks — route git/gh calls through internal/git, claude calls through internal/agent or internal/claude, bd calls through internal/tasks (see docs/specs/architecture.md 'What NOT to Do')"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    # The time.Sleep rule targets TEST synchronization only. time.Sleep is
    # legitimate in production code (polling intervals, backoff) and inside the
    # testutil.WaitFor* helpers themselves, so suppress forbidigo on every
    # non-test file (anything not ending in _test.go).
    - path-except: _test\.go
      linters:
        - forbidigo
