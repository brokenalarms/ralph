name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - name: Run Go tests
        run: cd go && go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Use the toolchain the module requires (go.mod's go directive) so the
      # linter is built with the same Go as the project — prebuilt golangci-lint
      # binaries are built with an older Go and cannot typecheck this module.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install golangci-lint (built with the module's Go)
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint (enforces no time.Sleep in tests — see go/.golangci.yml)
        run: cd go && "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Base-branch SOT lint (single source of truth — docs/specs/architecture.md §6)
        run: ./scripts/lint-base-branch.sh
