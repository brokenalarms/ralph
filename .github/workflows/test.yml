name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go/go.sum

      - name: Configure git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "CI"
          git config --global user.email "ci@test"

      - name: Copy prompts for embedding
        run: cp -r prompts go/cmd/ralph/prompts

      - name: Run Go tests
        run: cd go && go test ./...

      # Bash tests removed — bash implementation is deprecated, Go only
