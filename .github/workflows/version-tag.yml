name: Tag version from package.json
on:
  push:
    branches: [main]
jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create version tag from package.json
        run: |
          version=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version)")
          tag="v${version}"
          if git tag --list | grep -qxF "$tag"; then
            echo "Tag $tag already exists — skipping"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          echo "Created tag: $tag"
