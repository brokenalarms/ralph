name: Bump patch version

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump patch tag
        run: |
          # Skip if ralph already tagged this commit during auto-merge.
          if git describe --tags --exact-match HEAD 2>/dev/null | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag already exists on merge commit: $(git describe --tags --exact-match HEAD)"
            exit 0
          fi

          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          latest=${latest:-v0.1.0}
          major=$(echo "$latest" | sed 's/^v//' | cut -d. -f1)
          minor=$(echo "$latest" | sed 's/^v//' | cut -d. -f2)
          patch=$(echo "$latest" | sed 's/^v//' | cut -d. -f3)
          new_tag="v${major}.${minor}.$((patch + 1))"
          git tag "$new_tag"
          git push origin "$new_tag"
          echo "Created tag: $new_tag (was $latest)"
